services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  memgraph:
    image: memgraph/memgraph:latest
    container_name: memgraph
    ports:
      - "7688:7687"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
  
  apache_age:
    image: apache/age:latest
    container_name: apache_age
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G